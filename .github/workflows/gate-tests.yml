name: Gate Tests

# Unit tests for the Argus + CI auto-approval gate helpers, the gate workflows' security structure and the
# machine-ruleset transformer (TECH-7014). Runs on pull requests that touch those files. Read-only: no OIDC,
# no secrets, no network calls (the helpers are exercised against in-memory fakes).

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/auto-approve*.yml"
      - ".github/workflows/gate-tests.yml"
      - ".github/rulesets/**"
      - "scripts/review-policy-machine-cutover.jq"
  push:
    branches: [master]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/auto-approve*.yml"
      - ".github/workflows/gate-tests.yml"
      - ".github/rulesets/**"
      - "scripts/review-policy-machine-cutover.jq"

permissions:
  contents: read

jobs:
  gate-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned PyYAML
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check "pyyaml==6.0.2"

      - name: Run gate unit tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s .github/scripts/tests -p "test_*.py" -v'
