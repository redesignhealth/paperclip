name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci'
    # Fork-owned copy of upstream's pr-trusted.yml, so upstream changes to it
    # cannot alter fork CI without review. Resync deliberately from upstream.
    # Pinned to master; ci_aggregate.py only trusts this ref.
    uses: redesignhealth/paperclip/.github/workflows/pr-trusted.yml@master
